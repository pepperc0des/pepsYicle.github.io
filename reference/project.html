<!--
  ╔══════════════════════════════════════════════════════════════╗
  ║  project-detail.html  —  PROJECT DETAIL PAGE SECTION        ║
  ║                                                              ║
  ║  Shows an in-depth breakdown of a single project.           ║
  ║  Content (title, description, tags) is injected by          ║
  ║  showDetail() in main.js when the user clicks a gallery     ║
  ║  item.                                                       ║
  ║                                                              ║
  ║  To customize:                                               ║
  ║  • Replace .detail-img-fill divs with real <img> tags       ║
  ║  • Update showDetail() in main.js with real project data    ║
  ╚══════════════════════════════════════════════════════════════╝
-->

<section id="project-detail" class="page">
  <div class="detail-inner">

    <!-- ── Left column: project images ── -->
    <div class="detail-images-col animate-in">

      <!-- Main large image -->
      <div class="detail-img detail-img-main">
        <div class="detail-torn-frame"></div>
        <!--
          Replace .detail-img-fill with your image:
          <img src="assets/project-main.jpg"
               alt="Project main image"
               style="position:absolute;inset:6px;width:calc(100%-12px);height:calc(100%-12px);object-fit:cover;">
        -->
        <div class="detail-img-fill"></div>
      </div>

      <!-- Two smaller images side by side -->
      <div class="detail-img-pair">
        <div class="detail-img">
          <div class="detail-torn-frame"></div>
          <div class="detail-img-fill"></div>
        </div>
        <div class="detail-img">
          <div class="detail-torn-frame"></div>
          <div class="detail-img-fill"></div>
        </div>
      </div>

    </div>
    <!-- End left column -->

    <!-- ── Right column: project text ── -->
    <div class="detail-text-col animate-in">

      <!-- Category label — filled by showDetail() in main.js -->
      <p class="detail-category" id="detail-category">Category</p>

      <!-- Project title — filled by showDetail() in main.js -->
      <h2 class="detail-title" id="detail-title">Project Title</h2>

      <!-- Description card with torn paper background -->
      <div class="detail-desc-wrap">
        <div class="detail-desc-torn"></div>
        <!-- Description text — filled by showDetail() in main.js -->
        <p class="detail-desc" id="detail-desc">
          Project description goes here.
        </p>
      </div>

      <!-- Tool / year tags — filled by showDetail() in main.js -->
      <div class="detail-tags" id="detail-tags"></div>

      <!-- Back button — returns to the gallery -->
      <button class="back-btn" onclick="backToGallery()">Back to Gallery</button>

    </div>
    <!-- End right column -->

  </div>
</section>
