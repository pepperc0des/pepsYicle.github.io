<!--
  ╔══════════════════════════════════════════════════════════════╗
  ║  work.html  —  WORK CATEGORIES PAGE SECTION                 ║
  ║                                                              ║
  ║  Displays a 2×2 grid of category cards.                     ║
  ║  Each card calls showGallery('Category Name') on click,     ║
  ║  which populates the gallery grid and navigates to it.      ║
  ║                                                              ║
  ║  To add a category:                                          ║
  ║  1. Copy a .category-card block below                       ║
  ║  2. Update the onclick category name                        ║
  ║  3. Update the label text                                    ║
  ║  4. Add matching entries to galleryData in main.js          ║
  ╚══════════════════════════════════════════════════════════════╝
-->

<section id="work" class="page">
 
  <!-- Section heading with torn paper divider -->
  <div class="section-header animate-in">
    <p class="section-sub">Selected Work</p>
    <h2 class="section-title">What I<br>Make</h2>
    <div class="section-header-torn"></div>
  </div>
 
  <!-- 2-column grid of category cards -->
  <div class="work-categories">
 
    <!-- Card 01 — 3D Work -->
    <div class="category-card animate-in" onclick="showGallery('3D Work')">
      <div class="category-torn-bg"></div>         <!-- torn paper background -->
      <div class="category-torn-inner"></div>       <!-- inner torn accent -->
      <div class="category-img-placeholder"></div>  <!-- optional bg image overlay -->
      <span class="category-num">01</span>
      <span class="category-label">3D Work</span>
    </div>
 
    <!-- Card 02 — Video & Animation -->
    <div class="category-card animate-in" onclick="showGallery('Video & Animation')">
      <div class="category-torn-bg"></div>
      <div class="category-torn-inner"></div>
      <div class="category-img-placeholder"></div>
      <span class="category-num">02</span>
      <span class="category-label">Video &amp; Animation</span>
    </div>
 
    <!-- Card 03 — UX / UI Design -->
    <div class="category-card animate-in" onclick="showGallery('UX / UI Design')">
      <div class="category-torn-bg"></div>
      <div class="category-torn-inner"></div>
      <div class="category-img-placeholder"></div>
      <span class="category-num">03</span>
      <span class="category-label">UX / UI Design</span>
    </div>
 
    <!-- Card 04 — Graphic Design -->
    <div class="category-card animate-in" onclick="showGallery('Graphic Design')">
      <div class="category-torn-bg"></div>
      <div class="category-torn-inner"></div>
      <div class="category-img-placeholder"></div>
      <span class="category-num">04</span>
      <span class="category-label">Graphic Design</span>
    </div>
 
  </div>
</section>
