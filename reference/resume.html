<!--
  ╔══════════════════════════════════════════════════════════════╗
  ║  resume.html  —  RÉSUMÉ PAGE SECTION                        ║
  ║                                                              ║
  ║  Two-column layout: PDF résumé on the left, software        ║
  ║  bubbles on the right.                                       ║
  ║                                                              ║
  ║  To customize:                                               ║
  ║  • Replace the resume-placeholder with a real PDF iframe    ║
  ║  • Update the softwares array in main.js                    ║
  ╚══════════════════════════════════════════════════════════════╝
-->

<section id="resume-page" class="page">

  <!-- Section heading -->
  <div class="section-header animate-in">
    <p class="section-sub">Documents &amp; Tools</p>
    <h2 class="section-title">Résumé &amp;<br>Softwares</h2>
    <div class="section-header-torn"></div>
  </div>

  <div class="resume-inner">

    <!-- ── Left column: résumé ── -->
    <div class="resume-col animate-in">
      <h2>Résumé</h2>

      <!-- Torn paper card — click opens the full-size modal -->
      <div class="resume-card" onclick="openResumeModal()">
        <div class="resume-torn-bg"></div>
        <div class="resume-placeholder">
        <iframe src="assets/Yi_Li_Resume.pdf"
                width="100%" height="100%"
                style="border:none;position:relative;z-index:1;">
         </iframe>
        </div>
      </div>

      <!-- Button to open the full-size modal -->
      <button class="resume-expand-btn" onclick="openResumeModal()">
        View Full Size
      </button>
    </div>
    <!-- End left column -->

    <!-- ── Right column: software bubbles ── -->
    <div class="softwares-col animate-in">
      <h2>Softwares</h2>
      <!--
        Bubbles are injected by main.js → buildSoftwareGrid().
        To change the list, edit the `softwares` array in main.js.
      -->
      <div class="software-grid" id="software-grid">
        <!-- JS inserts bubbles here -->
      </div>
    </div>
    <!-- End right column -->

  </div>
</section>

<!-- ═══════════════════════════════════════
     RESUME MODAL
     Full-size overlay triggered by
     openResumeModal() / closeResumeModal()
     ═══════════════════════════════════════ -->
<div class="modal-overlay" id="resume-modal">
  <div class="modal-inner">
    <button class="modal-close" onclick="closeResumeModal()">✕</button>
    <div class="modal-resume-inner">
      <!--
        Embed your PDF here:
        <iframe src="assets/resume.pdf"
                width="100%" height="100%"
                style="border:none;">
        </iframe>
      -->
      <p style="font-size:0.75rem;letter-spacing:0.12em;text-transform:uppercase;opacity:0.4;">
        Your résumé PDF appears here
      </p>
    </div>
  </div>
</div>
