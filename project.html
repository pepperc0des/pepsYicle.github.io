<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title id="pageTitle">Project — Yi Li</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Sora:wght@400;500;600;700;800&family=IBM+Plex+Sans:wght@400;500;600&display=swap" rel="stylesheet">
<link rel="stylesheet" href="styles.css">
</head>
<body>

<header class="topnav">
  <div class="nav-inner">
    <a class="brand" href="home.html"><span class="dot"></span>Yi Li</a>
    <nav class="links">
      <a href="work.html" class="active">Work</a>
      <a href="resume.html">Resume</a>
      <a href="contact.html">Contact</a>
    </nav>
  </div>
</header>

<main>
  <section class="page">
    <div class="wrap detail-top">
      <a class="back-link" href="work.html">&larr; Back to work</a>
    </div>
    <div class="wrap detail-head">
      <h1 id="pTitle"></h1>
      <div class="detail-meta">
        <div><div class="k">Category</div><div class="v" id="pCategory"></div></div>
        <div><div class="k">Role</div><div class="v" id="pRole"></div></div>
        <div><div class="k">Tools</div><div class="v" id="pTools"></div></div>
        <div><div class="k">Year</div><div class="v" id="pYear"></div></div>
      </div>
    </div>
    <div class="wrap">
      <div class="hero-image" id="pHero"></div>
    </div>
    <div class="wrap detail-body">
      <div>
        <div id="pBody"></div>
        <ul class="highlights" id="pHighlights"></ul>
      </div>
      <div class="side-shots">
        <div class="shot" id="pShot1"></div>
        <div class="shot" id="pShot2"></div>
      </div>
    </div>
    <div class="wrap">
      <a class="next-proj" id="pNext">
        <div><div class="k">Next project</div><h3 id="pNextTitle"></h3></div>
        <span>&rarr;</span>
      </a>
    </div>
  </section>
</main>

<footer class="wrap">
  <span>&copy; 2026 Yi Li</span>
  <span>Brooklyn, NY</span>
</footer>

<script src="main.js"></script>
<script>
const params = new URLSearchParams(window.location.search);
const id = params.get('id');
const p = projects.find(pr => pr.id === id) || projects[0];
const idx = projects.findIndex(pr => pr.id === p.id);
const next = projects[(idx + 1) % projects.length];

document.getElementById('pageTitle').textContent = p.title + ' — Yi Li';
document.getElementById('pTitle').textContent = p.title;
document.getElementById('pCategory').textContent = categories.find(c => c.id === p.category).label;
document.getElementById('pRole').textContent = p.role;
document.getElementById('pTools').textContent = p.tools;
document.getElementById('pYear').textContent = p.year;

const tones = ['coral','teal','marigold'];
const otherTones = tones.filter(t => t !== p.accent);

const pHero = document.getElementById('pHero');
pHero.style.background = `var(--${p.accent})`;
pHero.innerHTML = svgShape(shapeMap[p.id]);

document.getElementById('pBody').innerHTML = p.body.map(par => `<p>${par}</p>`).join('');
document.getElementById('pHighlights').innerHTML = (p.highlights || [])
  .map(h => `<li><span class="hmark">&#10003;</span>${h}</li>`).join('');

const shot1 = document.getElementById('pShot1');
shot1.style.background = `var(--${otherTones[0]})`;
shot1.innerHTML = svgShape('lines');

const shot2 = document.getElementById('pShot2');
shot2.style.background = `var(--${otherTones[1]})`;
shot2.innerHTML = svgShape('stack');

const nextLink = document.getElementById('pNext');
nextLink.href = `project.html?id=${next.id}`;
document.getElementById('pNextTitle').textContent = next.title;
</script>

</body>
</html>
