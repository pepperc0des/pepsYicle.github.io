<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Work — Yi Li</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Sora:wght@400;500;600;700;800&family=IBM+Plex+Sans:wght@400;500;600&display=swap" rel="stylesheet">
<link rel="stylesheet" href="styles.css">
</head>
<body>

<header class="topnav">
  <div class="nav-inner">
    <a class="brand" href="home.html"><span class="dot"></span>Yi Li</a>
    <nav class="links">
      <a href="work.html" class="active">Work</a>
      <a href="resume.html">Resume</a>
      <a href="contact.html">Contact</a>
    </nav>
  </div>
</header>

<main>
  <section class="page">
    <div class="wrap page-head">
      <h1>Selected work</h1>
      <p>A list of brand and product projects. Click any project for the full breakdown.</p>
    </div>
    <div class="wrap filters" id="filters"></div>
    <div class="wrap grid-work-wrap">
      <button class="scroll-arrow left" id="arrow-left" onclick="scrollGallery(-1)" aria-label="Scroll left">&larr;</button>
      <div class="grid-work" id="grid"></div>
      <button class="scroll-arrow right" id="arrow-right" onclick="scrollGallery(1)" aria-label="Scroll right">&rarr;</button>
    </div>
  </section>
</main>

<footer class="wrap">
  <span>&copy; 2026 Yi Li</span>
  <span>Brooklyn, NY</span>
</footer>

<script src="main.js"></script>
<script>
let activeFilter = 'all';

function renderFilters(){
  const filtersEl = document.getElementById('filters');
  filtersEl.innerHTML = categories.map(c =>
    `<button class="filter-btn ${c.id===activeFilter?'active':''}" data-cat="${c.id}">${c.label}</button>`
  ).join('');
  filtersEl.querySelectorAll('.filter-btn').forEach(btn=>{
    btn.addEventListener('click', ()=>{
      activeFilter = btn.dataset.cat;
      filtersEl.querySelectorAll('.filter-btn').forEach(b=>b.classList.remove('active'));
      btn.classList.add('active');
      renderGrid();
    });
  });
}

function renderGrid(){
  const gridEl = document.getElementById('grid');
  const list = activeFilter === 'all' ? projects : projects.filter(p=>p.category===activeFilter);
  gridEl.innerHTML = list.map(p => `
    <a class="card" href="project.html?id=${p.id}">
      <div class="card-thumb" style="background:var(--${p.accent})">${svgShape(shapeMap[p.id])}</div>
      <div class="card-meta"><h3>${p.title}</h3><span>${p.year}</span></div>
      <div class="card-tag" style="color:var(--${p.accent})">${categories.find(c=>c.id===p.category).label}</div>
    </a>
  `).join('');
  gridEl.scrollLeft = 0;
  updateArrows();
  gridEl.removeEventListener('scroll', updateArrows);
  gridEl.addEventListener('scroll', updateArrows);
}

function scrollGallery(dir){
  const gridEl = document.getElementById('grid');
  if(!gridEl) return;
  const cardWidth = gridEl.querySelector('.card')?.offsetWidth || 300;
  gridEl.scrollBy({left: dir * (cardWidth + 26) * 2, behavior:'smooth'});
}

function updateArrows(){
  const gridEl = document.getElementById('grid');
  const left = document.getElementById('arrow-left');
  const right = document.getElementById('arrow-right');
  if(!gridEl || !left || !right) return;
  left.disabled = gridEl.scrollLeft < 8;
  right.disabled = gridEl.scrollLeft >= gridEl.scrollWidth - gridEl.clientWidth - 8;
}

window.addEventListener('resize', updateArrows);
renderFilters();
renderGrid();
</script>

</body>
</html>
