<!-- watercolor-style wobble used by the illustrations -->
<svg width="0" height="0" style="position:absolute" aria-hidden="true"><filter id="wc"><feTurbulence type="fractalNoise" baseFrequency=".03" numOctaves="2" seed="3" result="n"/><feDisplacementMap in="SourceGraphic" in2="n" scale="6"/></filter></svg>
<div class="bg-shapes" aria-hidden="true"><i class="s1"></i><i class="s2"></i><i class="s3"></i></div>
<div class="wrap">
  <header>
    <a class="logo-link" href="#/home" aria-label="Home"><img class="logo" src="assets/pepper_logo.png" alt="Yi Li logo"></a>
    <nav aria-label="Main">
      <a href="#/work" data-r="work">Work</a>
      <a href="#/resume" data-r="resume">Resume</a>
      <a href="#/contact" data-r="contact">Contact</a>
    </nav>
  </header>
  <main id="app"></main>
</div>
<footer><div class="wrap"><span>© 2026 Yi Li</span><button id="theme" type="button">Dark mode</button></div></footer>
<script src="main.js"></script>
</body>
