<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Contact — Yi Li</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Sora:wght@400;500;600;700;800&family=IBM+Plex+Sans:wght@400;500;600&display=swap" rel="stylesheet">
<link rel="stylesheet" href="styles.css">
</head>
<body>

<header class="topnav">
  <div class="nav-inner">
    <a class="brand" href="home.html"><span class="dot"></span>Yi Li</a>
    <nav class="links">
      <a href="work.html">Work</a>
      <a href="resume.html">Resume</a>
      <a href="contact.html" class="active">Contact</a>
    </nav>
  </div>
</header>

<main>
  <section class="page contact wrap">
    <div class="section-label">Contact</div>
    <h1>Let's connect</h1>
    <p class="lead">Reach out to work together! I read everything myself and will respond within the week.</p>
    <a class="email-link" href="mailto:yilicareer06@gmail.com">yilicareer06@gmail.com</a>
    <div class="social-row">
      <a href="#" target="_blank" rel="noopener">LinkedIn</a>
      <a href="#" target="_blank" rel="noopener">Instagram</a>
      <a href="#" target="_blank" rel="noopener">Dribbble</a>
    </div>
    <form class="cf" onsubmit="return sendMail(event)">
      <input type="text" placeholder="Name" id="cf-name" required>
      <input type="email" placeholder="Email" id="cf-email" required>
      <textarea placeholder="Tell me a bit about the project" id="cf-msg" required></textarea>
      <button type="submit" class="btn primary">Send message</button>
    </form>
  </section>
</main>

<footer class="wrap">
  <span>&copy; 2026 Yi Li</span>
  <span>Brooklyn, NY</span>
</footer>

<script>
function sendMail(e){
  e.preventDefault();
  const name = document.getElementById('cf-name').value;
  const email = document.getElementById('cf-email').value;
  const msg = document.getElementById('cf-msg').value;
  const body = encodeURIComponent(`${msg}\n\n— ${name} (${email})`);
  window.location.href = `mailto:hello@alexrivera.design?subject=Project inquiry&body=${body}`;
  return false;
}
</script>

</body>
</html>
